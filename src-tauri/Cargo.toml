[package]
name = "blizzard"
version = "1.0.1"
description = "A local study tutor that tracks how well you understand."
authors = ["Swiss4ppD3v"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
